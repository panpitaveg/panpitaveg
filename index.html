<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar MP</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar MP">
<meta name="theme-color" content="#12151C">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#12151C; --surface:#1A1E28; --surface-2:#20242F; --border:#2A2F3D;
  --text:#ECE9E2; --text-dim:#8E94A6;
  --cold:#4C8BF5; --mid:#F0A93B; --hot:#E8483C; --line:#3A4256;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text); font-family:'IBM Plex Sans', sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:48px; min-height:100vh;}
.wrap{max-width:640px; margin:0 auto; padding:20px 16px 0;}

header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px;}
.brand h1{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px; letter-spacing:-0.02em;}
.brand p{color:var(--text-dim); font-size:12px; margin-top:3px; font-family:'IBM Plex Mono', monospace;}
.badge{font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.06em; padding:5px 9px; border-radius:20px; white-space:nowrap; text-transform:uppercase;}
.badge.ok{border:1px solid #4CAF7D; color:#4CAF7D;}
.badge.err{border:1px solid var(--hot); color:var(--hot);}

.report-meta{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--text-dim); border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:10px 2px; margin-bottom:16px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px;}
.report-meta strong{color:var(--text); font-weight:600;}

.chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px;}
.chip{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--text-dim); background:var(--surface); border:1px solid var(--border); padding:5px 10px; border-radius:20px;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; display:flex; gap:14px; position:relative; overflow:hidden;}
.card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--lvl-color);}
.card-body{flex:1; min-width:0;}
.org{font-size:11px; color:var(--text-dim); font-family:'IBM Plex Mono', monospace; text-transform:uppercase; letter-spacing:0.03em;}
.title{font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; line-height:1.3; margin:4px 0 8px;}
.meta-row{display:flex; flex-wrap:wrap; gap:8px 14px; font-size:12px; color:var(--text-dim); margin-bottom:10px;}
.meta-row b{color:var(--text); font-weight:600;}
.tags{display:flex; flex-wrap:wrap; gap:6px;}
.tag{font-size:10.5px; font-family:'IBM Plex Mono', monospace; padding:3px 8px; border-radius:6px; background:var(--surface-2); color:var(--text-dim);}
.tag.match{color:var(--mid); background:rgba(240,169,59,0.1);}

.therm-wrap{width:34px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:2px;}
.therm-pct{font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:13px; margin-bottom:6px; color:var(--lvl-color);}
.therm-label{font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--text-dim); text-transform:uppercase; margin-top:6px; letter-spacing:0.05em;}

.empty{font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--text-dim); text-align:center; padding:40px 20px; border:1px dashed var(--border); border-radius:14px;}

footer{max-width:640px; margin:28px auto 0; padding:16px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-dim); text-align:center; line-height:1.6;}
footer b{color:var(--text);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Radar MP</h1>
      <p id="dateLabel">—</p>
    </div>
    <div class="badge ok" id="statusBadge">cargando</div>
  </header>

  <div class="report-meta">
    <span>Ultimos <strong id="metaDias">7</strong> dias</span>
    <span><strong id="metaCount">0</strong> compras agiles</span>
  </div>

  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>

<footer>
  <b>Radar MP</b> corre solo 3 veces al dia via GitHub Actions.<br>
  Edita <b>keywords.txt</b> en el repo para cambiar las palabras clave.
</footer>

<script>
function fmtMonto(n){ return "$" + n.toLocaleString("es-CL"); }
function nivel(pct){
  if (pct < 40) return {label:"Bajo", color:"var(--cold)"};
  if (pct < 68) return {label:"Medio", color:"var(--mid)"};
  return {label:"Alto", color:"var(--hot)"};
}
function thermSVG(pct, color){
  const h = 46, fillH = Math.round((pct/100) * (h-10));
  return `<svg width="16" height="${h+10}" viewBox="0 0 16 ${h+10}">
    <rect x="5" y="2" width="6" height="${h-6}" rx="3" fill="none" stroke="var(--line)" stroke-width="1.3"/>
    <circle cx="8" cy="${h+2}" r="6" fill="none" stroke="var(--line)" stroke-width="1.3"/>
    <rect x="5.8" y="${2 + (h-6-fillH)}" width="4.4" height="${fillH}" rx="2.2" fill="${color}"/>
    <circle cx="8" cy="${h+2}" r="4.3" fill="${color}"/>
  </svg>`;
}
function cardHTML(l){
  const lvl = nivel(l.probabilidad);
  return `<div class="card" style="--lvl-color:${lvl.color}">
    <div class="card-body">
      <div class="org">${l.org}</div>
      <div class="title">${l.titulo}</div>
      <div class="meta-row">
        <span>Monto: <b>${fmtMonto(l.monto)}</b></span>
        <span>Cierre: <b>${l.cierre || '—'}</b></span>
        <span>Faltan: <b>${l.dias} dias</b></span>
        <span>Cotizaciones: <b>${l.ofertas_actuales}</b></span>
      </div>
      <div class="tags">
        <span class="tag match">#${l.keyword}</span>
        ${l.region ? `<span class="tag">${l.region}</span>` : ""}
      </div>
    </div>
    <div class="therm-wrap">
      <div class="therm-pct">${l.probabilidad}%</div>
      ${thermSVG(l.probabilidad, lvl.color)}
      <div class="therm-label">${lvl.label}</div>
    </div>
  </div>`;
}

async function cargar(){
  try{
    const res = await fetch('reporte.json?_=' + Date.now());
    if(!res.ok) throw new Error('sin reporte.json todavia');
    const data = await res.json();

    document.getElementById("statusBadge").textContent = "reporte real";
    document.getElementById("statusBadge").className = "badge ok";
    document.getElementById("dateLabel").textContent = "Generado: " + new Date(data.generado).toLocaleString("es-CL");
    document.getElementById("metaDias").textContent = data.dias_atras;
    document.getElementById("metaCount").textContent = data.licitaciones.length;
    document.getElementById("chips").innerHTML = data.keywords.map(k=>`<span class="chip">${k}</span>`).join("");

    if(data.licitaciones.length === 0){
      document.getElementById("list").innerHTML = `<div class="empty">Sin compras agiles nuevas para tus keywords en los ultimos ${data.dias_atras} dias.</div>`;
    } else {
      document.getElementById("list").innerHTML = data.licitaciones.map(cardHTML).join("");
    }
  } catch(e){
    document.getElementById("statusBadge").textContent = "sin datos aun";
    document.getElementById("statusBadge").className = "badge err";
    document.getElementById("dateLabel").textContent = "Todavia no corre el primer reporte";
    document.getElementById("list").innerHTML = `<div class="empty">Aun no hay reporte.json en el repo.<br>Corre el workflow de GitHub Actions manualmente (pestaña Actions → Radar MP → Run workflow) para generar el primero.</div>`;
  }
}
cargar();
</script>
</body>
</html>
